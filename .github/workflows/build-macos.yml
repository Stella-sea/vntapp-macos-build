name: Build VntApp 1.2.13 macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout VntApp 1.2.13 source
        uses: actions/checkout@v4
        with:
          repository: vnt-dev/VntApp
          ref: '1.2.13'
          path: VntApp

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter pub get
        working-directory: VntApp
        run: flutter pub get

      - name: Build macOS app (release, no codesign)
        working-directory: VntApp
        run: flutter build macos --release --no-codesign

      - name: Package .dmg
        run: |
          APP="VntApp/build/macos/Build/Products/Release/vnt_app.app"
          ls -la "$APP"
          hdiutil create -volname "VntApp 1.2.13" -srcfolder "$APP" -ov -format UDZO "VntApp-1.2.13-macos-arm64.dmg"
          ls -lh VntApp-1.2.13-macos-arm64.dmg
          shasum -a 256 VntApp-1.2.13-macos-arm64.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: VntApp-1.2.13-macos-arm64.dmg
          path: VntApp-1.2.13-macos-arm64.dmg

      - name: Create GitHub Release with .dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.13-macos-arm64
          name: VntApp 1.2.13 macOS (Apple Silicon)
          body: |
            Unofficial macOS (Apple Silicon / arm64) build of VntApp 1.2.13 (Flutter), built from vnt-dev/VntApp @ 1.2.13.
            Unsigned - on first launch, right-click the app and choose Open (Gatekeeper bypass).
          files: VntApp-1.2.13-macos-arm64.dmg
          draft: false
          prerelease: true
