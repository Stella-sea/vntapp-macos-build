name: Build VntApp 1.2.13 macOS (Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout build repo (patches)
        uses: actions/checkout@v4

      - name: Checkout VntApp 1.2.13 source
        uses: actions/checkout@v4
        with:
          repository: vnt-dev/VntApp
          ref: '1.2.13'
          path: VntApp

      - name: Apply r6 patches
        run: |
          cd VntApp
          git apply ../patches/r6-dart.patch
          echo "--- patched markers ---"
          grep -n "relaunchAsAdmin\|setupStableWorkDir\|vnt-ready-token\|adminRelaunchInProgress" lib/main.dart | head -8
          grep -n "logFile.exists" lib/connect_log.dart | head -3
          grep -n "return false" macos/Runner/AppDelegate.swift | head -3

      - name: Strip app-sandbox entitlement (blocks TUN/utun creation)
        run: |
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.app-sandbox" VntApp/macos/Runner/Release.entitlements || true
          echo "--- Release.entitlements after strip ---"
          cat VntApp/macos/Runner/Release.entitlements

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter pub get
        working-directory: VntApp
        run: flutter pub get

      - name: Flutter analyze (non-blocking, log only)
        working-directory: VntApp
        run: flutter analyze
        continue-on-error: true

      - name: Build macOS app (release)
        working-directory: VntApp
        run: flutter build macos --release

      - name: Package .dmg
        run: |
          APP="VntApp/build/macos/Build/Products/Release/vnt_app.app"
          ls -la "$APP"
          echo "--- binary architectures (must be arm64) ---"
          lipo -archs "$APP/Contents/MacOS/vnt_app"
          lipo -archs "$APP/Contents/MacOS/vnt_app" | grep -q arm64
          echo "--- entitlements (unsigned build, informational) ---"
          codesign -d --entitlements :- "$APP" 2>&1 | head -20 || true
          hdiutil create -volname "VntApp 1.2.13" -srcfolder "$APP" -ov -format UDZO "VntApp-1.2.13-macos-arm64-r6.dmg"
          ls -lh VntApp-1.2.13-macos-arm64-r6.dmg
          shasum -a 256 VntApp-1.2.13-macos-arm64-r6.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: VntApp-1.2.13-macos-arm64-r6.dmg
          path: VntApp-1.2.13-macos-arm64-r6.dmg

      - name: Create GitHub Release with .dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.13-macos-arm64-r6
          name: VntApp 1.2.13 macOS (Apple Silicon) r6
          body: |
            Unofficial macOS (Apple Silicon / arm64) build of VntApp 1.2.13 (Flutter), built from vnt-dev/VntApp @ 1.2.13 + r6 patches.
            r6 fixes (on top of r5):
            - Tray: all window hide/show/close now go through window_manager; the app no longer quits when its last window closes (AppDelegate returns false) — hiding to tray keeps the process and VPN connection alive. Tray Quit and the close dialog's "close app" path disconnect all connections first, then quit explicitly.
            - Admin relaunch: the old 800ms blind wait is replaced by a ready-file handshake — the new admin instance writes a ready file with a random token once its window is shown; the old instance only exits after seeing it (30s timeout, otherwise it stays and shows an error instead of flashing away).
            - Config handover: before relaunch, the root shell copies the console user's SharedPreferences plist to root's plist (only when the user copy exists and is newer), so configs, unique ID and preferences survive the user -> root switch.
            - Still requires the system password on every cold start (no Touch ID / password-free launch yet — that needs a privileged helper, future work).
            Unsigned - on first launch, right-click the app and choose Open (Gatekeeper bypass).
          files: VntApp-1.2.13-macos-arm64-r6.dmg
          draft: false
          prerelease: true
